name: Development Deploy
on:
  push:
    branches: [develop, dev]  # Pro development větve

jobs:
  dev-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      
      # Získání GitHub hash pro dev verzi
      - name: Get commit hash
        id: commit_hash
        run: echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # Nastavení dev verze
      - name: Set dev version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DEV_VERSION="${VERSION}-dev-${{ steps.commit_hash.outputs.hash }}"
          echo "DEV_VERSION=$DEV_VERSION" >> $GITHUB_ENV
          echo "Dev version: $DEV_VERSION"

      # Aktualizace patičky pro dev
      - name: Update footer for dev
        run: |
          sed -i "s/core[0-9]\+\.[0-9]\+\.[0-9]\+[^0-9]*/core${{ env.DEV_VERSION }}/g" src/lib/component/Footer.svelte
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -am "chore: update footer to dev ${{ env.DEV_VERSION }}"
          git push

      # Deploy na Vercel (development)
      - name: Trigger Vercel Deploy
        run: curl -X POST "https://api.vercel.com/v1/integrations/deploy/$VERCEL_PROJECT_ID"
        env:
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }} 